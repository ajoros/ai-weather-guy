name: Update maps

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: wn3-update
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  cook-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Restore last cook
        uses: actions/cache@v4
        with:
          path: |
            site/frames
            site/manifest.json
          key: wn3-frames-${{ github.run_id }}
          restore-keys: |
            wn3-frames-

      - name: Earth Engine auth
        env:
          GCP_SA_JSON: ${{ secrets.GCP_SA_JSON }}
        run: |
          test -n "$GCP_SA_JSON"
          printf '%s\n' "$GCP_SA_JSON" > "$RUNNER_TEMP/gcp-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-sa.json" >> "$GITHUB_ENV"

      - name: Cook if a newer run is in Earth Engine
        id: cook
        env:
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
        run: |
          set -o pipefail
          python cook_ee.py --workers 4 | tee cook.log
          if grep -q '^COOK_STATUS=noop$' cook.log; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
          else
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage github.io snapshot
        if: steps.cook.outputs.changed == 'yes'
        run: python stage_pages.py site _pages

      - uses: actions/upload-pages-artifact@v3
        if: steps.cook.outputs.changed == 'yes'
        with:
          path: _pages

      - uses: actions/deploy-pages@v4
        if: steps.cook.outputs.changed == 'yes'
